name: biux
description: Biux - App de ciclismo social con tracking, grupos y mapas.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ─── Firebase ───────────────────────────────────────────
  firebase_core: ^4.1.1
  firebase_auth: ^6.0.2
  firebase_analytics: ^12.0.1
  firebase_performance: ^0.11.1+4
  firebase_crashlytics: ^5.0.2
  firebase_database: ^12.0.2
  firebase_messaging: ^16.1.1
  firebase_storage: ^13.0.1
  cloud_firestore: ^6.0.2

  # ─── Navegación y Estado ────────────────────────────────
  go_router: ^17.0.1
  provider: ^6.1.5+1

  # ─── Mapas y Ubicación ─────────────────────────────────
  google_maps_flutter: ^2.13.1
  geolocator: ^14.0.2
  location: ^8.0.1
  fluster: ^1.2.0

  # ─── Networking ─────────────────────────────────────────
  http: ^1.5.0
  dio: ^5.9.0

  # ─── UI - Imágenes y Media ─────────────────────────────
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  image_picker: ^1.2.0
  image: ^4.3.0
  photo_manager: ^3.7.1
  easy_image_viewer: ^1.5.1
  flutter_image_compress: ^2.3.0

  # ─── UI - Ratings ──────────────────────────────────────
  smooth_star_rating_nsafe: ^1.0.0+1

  # ─── UI - Loading ──────────────────────────────────────
  loading_indicator: ^3.1.1
  shimmer: ^3.0.0

  # ─── UI - Iconos ───────────────────────────────────────
  cupertino_icons: ^1.0.8

  # ─── QR y Scanner ──────────────────────────────────────
  mobile_scanner: ^7.1.4

  # ─── Video ─────────────────────────────────────────────
  video_player: ^2.8.1
  camera: ^0.11.1

  # ─── Impresión ─────────────────────────────────────────
  printing: ^5.14.2

  # ─── Utilidades ────────────────────────────────────────
  intl: ^0.20.2
  timeago: ^3.7.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  path: ^1.9.1
  url_launcher: ^6.3.2
  share_plus: ^12.0.0
  permission_handler: ^12.0.1
  vector_math: ^2.2.0
  flutter_local_notifications: ^20.1.0
  flutter_plugin_android_lifecycle: ^2.0.30
  mime: ^2.0.0
  file_picker: ^8.0.0
  flutter_secure_storage: ^9.2.4

  # ─── Autenticación y Seguridad ─────────────────────────
  local_auth: ^3.0.1

  # ─── Audio ─────────────────────────────────────────────
  record: ^6.2.0
  just_audio: ^0.9.40

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.1
  mockito: ^5.4.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "img/biux_logo_background_blue.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#16242D"
  adaptive_icon_foreground: "img/biux_logo_letters_white.png"
  android_12:
    adaptive_icon_background: "#16242D"
    adaptive_icon_foreground: "img/biux_logo_letters_white.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: img/biux_logo_background_blue.png
  ios: true
  android: true
  android_12:
    image: img/biux_logo_background_blue.png
    color: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - img/
    - img/shop/
    - img/shop/products/
